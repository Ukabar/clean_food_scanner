workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: APP_STORE_CONNECT_INTEGRATION_NAME
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.cleanfoodscanner.app
    scripts:
      - name: Flutter clean
        script: flutter clean
      - name: Get Flutter packages
        script: flutter pub get
      - name: Check Dart formatting
        script: dart format --set-exit-if-changed .
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch iOS signing files
        script: app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: flutter build ipa --release --build-number=$BUILD_NUMBER
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
