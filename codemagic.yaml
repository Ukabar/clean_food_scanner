workflows:
  testFlight:
    name: "Labelora: Food Scanner - TestFlight"
    max_build_duration: 60

    integrations:
      app_store_connect: SpeedTeste

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.labelora.foodscanner

      vars:
        BUNDLE_ID: com.labelora.foodscanner

    scripts:
      - name: Show build environment
        script: |
          flutter --version
          dart --version
          ruby --version
          pod --version
          xcodebuild -version
          git rev-parse HEAD
          git log -1 --oneline
          git branch --show-current || true

      - name: Set Flutter configuration
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Clean Flutter build artifacts
        script: |
          flutter clean

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Verify iOS project and plugins
        script: |
          set -euo pipefail

          echo "COMMIT:"
          git rev-parse HEAD

          echo "BRANCH:"
          git branch --show-current || true

          echo "PODFILE:"
          test -f ios/Podfile || {
            echo "ERROR: ios/Podfile is missing"
            exit 1
          }

          git log -1 --oneline

          sed -n '1,220p' ios/Podfile

          grep -n "platform :ios, '15.0'" ios/Podfile || {
            echo "ERROR: platform iOS 15.0 missing"
            exit 1
          }

          grep -n "flutter_ios_podfile_setup" ios/Podfile || {
            echo "ERROR: Flutter pod setup missing"
            exit 1
          }

          grep -n "flutter_install_all_ios_pods" ios/Podfile || {
            echo "ERROR: Flutter pod installer missing"
            exit 1
          }

          test -f ios/Flutter/Generated.xcconfig || {
            echo "ERROR: Generated.xcconfig missing"
            exit 1
          }

          test -f pubspec.lock || {
            echo "ERROR: pubspec.lock missing"
            exit 1
          }

          test -f .flutter-plugins-dependencies || {
            echo "ERROR: .flutter-plugins-dependencies missing"
            exit 1
          }

          grep -n "enable-swift-package-manager: false" pubspec.yaml || {
            echo "ERROR: Flutter Swift Package Manager is not disabled in pubspec.yaml"
            exit 1
          }

          if grep -E "FlutterGeneratedPluginSwiftPackage|XCLocalSwiftPackageReference|XCSwiftPackageProductDependency" ios/Runner.xcodeproj/project.pbxproj >/dev/null; then
            echo "ERROR: Flutter Swift Package Manager references remain in project.pbxproj"
            exit 1
          fi

          if grep -q "google_mobile_ads:" pubspec.lock; then
            echo "google_mobile_ads is present; verifying dependent Flutter iOS WebView plugin."

            grep -n "webview_flutter_wkwebview" pubspec.lock || {
              echo "ERROR: package missing from pubspec.lock"
              exit 1
            }

            grep -n "webview_flutter_wkwebview" .flutter-plugins-dependencies || {
              echo "ERROR: plugin missing from Flutter metadata"
              exit 1
            }

            echo "google_mobile_ads and webview_flutter_wkwebview plugin metadata verified."
          else
            echo "google_mobile_ads is not present in pubspec.lock."
            echo "webview_flutter_wkwebview is therefore not expected in the current dependency graph."
            echo "If Codemagic reports google_mobile_ads -> webview_flutter_wkwebview, it is building a stale commit or different branch."
          fi

      - name: Analyze project
        script: |
          rm -rf build
          flutter analyze lib

      - name: Run Flutter tests
        script: |
          flutter test

      - name: Reset iOS CocoaPods
        script: |
          set -e

          flutter config --no-enable-swift-package-manager

          rm -rf build
          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

          flutter pub get

          cd ios
          pod deintegrate || true
          rm -f Podfile.lock
          pod install --repo-update
          cd ..

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Verify iOS Bundle Identifier
        script: |
          set -euo pipefail

          if ! grep -R "$BUNDLE_ID" ios/Runner.xcodeproj/project.pbxproj >/dev/null; then
            echo "ERROR: Expected Bundle ID was not found in the iOS project: $BUNDLE_ID"
            exit 1
          fi

          echo "Bundle ID verified: $BUNDLE_ID"

      - name: Verify iPhone and iPad support
        script: |
          set -euo pipefail

          if grep -q 'TARGETED_DEVICE_FAMILY = "1,2"' ios/Runner.xcodeproj/project.pbxproj || \
             grep -q 'TARGETED_DEVICE_FAMILY = 1,2' ios/Runner.xcodeproj/project.pbxproj; then
            echo "Universal iPhone and iPad support verified."
          else
            echo "ERROR: TARGETED_DEVICE_FAMILY is not configured as 1,2."
            exit 1
          fi

      - name: Verify iOS app icons have no alpha
        script: |
          python3 - <<'PY'
          import pathlib
          import struct
          import sys

          icon_dir = pathlib.Path(
              "ios/Runner/Assets.xcassets/AppIcon.appiconset"
          )

          failures = []

          if not icon_dir.exists():
              print(f"App icon directory was not found: {icon_dir}")
              sys.exit(1)

          def png_info(path):
              data = path.read_bytes()

              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  failures.append(f"{path.name}: not a PNG file")
                  return

              width, height, bit_depth, color_type = struct.unpack(
                  ">IIBB",
                  data[16:26],
              )

              offset = 8
              has_trns = False

              while offset + 12 <= len(data):
                  length = struct.unpack(
                      ">I",
                      data[offset:offset + 4],
                  )[0]

                  chunk_type = data[offset + 4:offset + 8]

                  if chunk_type == b"tRNS":
                      has_trns = True

                  offset += 12 + length

                  if chunk_type == b"IEND":
                      break

              if color_type in (4, 6) or has_trns:
                  failures.append(
                      f"{path.name}: "
                      f"{width}x{height}, "
                      f"color_type={color_type}, "
                      f"tRNS={has_trns}"
                  )

          png_files = sorted(icon_dir.glob("*.png"))

          if not png_files:
              print("No PNG app icons were found.")
              sys.exit(1)

          for path in png_files:
              png_info(path)

          if failures:
              print("Invalid iOS app icons with alpha/transparency:")
              print("\n".join(failures))
              sys.exit(1)

          print(
              "All iOS app icons are valid "
              "and contain no alpha channel."
          )
          PY

      - name: Build signed IPA
        script: |
          if [ -f /Users/builder/export_options.plist ]; then
            flutter build ipa --release \
              --build-number="$PROJECT_BUILD_NUMBER" \
              --export-options-plist=/Users/builder/export_options.plist
          else
            flutter build ipa --release \
              --build-number="$PROJECT_BUILD_NUMBER"
          fi

      - name: Verify generated IPA
        script: |
          set -euo pipefail

          IPA_PATH="$(
            find build/ios/ipa \
              -maxdepth 1 \
              -name '*.ipa' \
              | head -n 1
          )"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA file was generated."
            exit 1
          fi

          TEST_DIR="/tmp/labelora_ipa"

          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"

          unzip -q "$IPA_PATH" -d "$TEST_DIR"

          RUNNER_APP="$(
            find "$TEST_DIR/Payload" \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              | head -n 1
          )"

          if [ -z "$RUNNER_APP" ]; then
            echo "ERROR: Runner.app was not found inside the IPA."
            exit 1
          fi

          PACKAGED_BUNDLE_ID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$RUNNER_APP/Info.plist"
          )"

          if [ "$PACKAGED_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "ERROR: Packaged Bundle ID is $PACKAGED_BUNDLE_ID"
            echo "Expected Bundle ID is $BUNDLE_ID"
            exit 1
          fi

          echo "IPA verified successfully."
          echo "Bundle ID: $PACKAGED_BUNDLE_ID"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - hornet.devlo@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
